name: .NET 8 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore PropertyShowing.sln
      - run: dotnet build PropertyShowing.sln --no-restore --configuration Release
      - run: dotnet test PropertyShowing.sln --no-build --configuration Release
